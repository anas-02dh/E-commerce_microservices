services:

  # EUREKA
  eureka-server:
    build:
      context: ./discovery-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network

  # KEYCLOAK
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ecommerce-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - ecommerce-network

  # KAFKA
  kafka:
    image: apache/kafka:4.0.0
    container_name: ecommerce-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        INTERNAL://:29092,
        EXTERNAL://:9092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    networks:
      - ecommerce-network

  #Databases
  catalog-postgres:
    image: postgres:17
    container_name: catalog-db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  customer-postgres:
    image: postgres:17
    container_name: customer-db
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - customer_postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  order-postgres:
    image: postgres:17
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5435:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  payment-postgres:
    image: postgres:17
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5436:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  notification-postgres:
    image: postgres:17
    container_name: notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5437:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  #Services
  catalog-service:
    build:
      context: ./catalog-service
    container_name: catalog-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - catalog-postgres
    networks:
      - ecommerce-network

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - customer-postgres
      - keycloak
    networks:
      - ecommerce-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile

    container_name: order-service

    ports:
      - "8083:8083"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      - kafka

    networks:
      - ecommerce-network


  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile

    container_name: payment-service

    ports:
      - "8084:8084"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      - kafka

    networks:
      - ecommerce-network


  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    container_name: notification-service

    ports:
      - "8086:8086"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      - kafka

    networks:
      - ecommerce-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - eureka-server
      - keycloak
      - catalog-service
      - customer-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - ecommerce-network

volumes:
  catalog_postgres_data:
  customer_postgres_data:
  order_postgres_data:
  payment_postgres_data:
  notification_postgres_data:

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge