services:
  order-postgres:
    image: postgres:17
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5435:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network


volumes:
  order_postgres_data:

networks:
  ecommerce-network:
    driver: bridge


