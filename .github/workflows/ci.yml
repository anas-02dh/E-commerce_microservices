
  name: Ecommerce Microservices CI

  on:
    push:
      branches:
        - main
        - develop

    pull_request:
      branches:
        - main

  jobs:

    build:

      runs-on: ubuntu-latest

      steps:

        # ==========================================
        # 1. Checkout repository
        # ==========================================
        - name: Checkout source code
          uses: actions/checkout@v4


        # ==========================================
        # 2. Set up Java 21
        # ==========================================
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven


        # ==========================================
        # 3. Build Discovery Server
        # ==========================================
        - name: Build Discovery Server
          working-directory: discovery-server
          run: ./mvnw clean package -DskipTests


        # ==========================================
        # 4. Build Catalog Service
        # ==========================================
        - name: Build Catalog Service
          working-directory: catalog-service
          run: ./mvnw clean package -DskipTests


        # ==========================================
        # 5. Build Customer Service
        # ==========================================
        - name: Build Customer Service
          working-directory: customer-service
          run: ./mvnw clean package -DskipTests


        # ==========================================
        # 6. Build Order Service
        # ==========================================
        - name: Build Order Service
          working-directory: order-service
          run: ./mvnw clean package -DskipTests


        # ==========================================
        # 7. Build Payment Service
        # ==========================================
        - name: Build Payment Service
          working-directory: payment-service
          run: ./mvnw clean package -DskipTests


        # ==========================================
        # 8. Build Notification Service
        # ==========================================
        - name: Build Notification Service
          working-directory: notification-service
          run: ./mvnw clean package -DskipTests


        # ==========================================
        # 9. Build API Gateway
        # ==========================================
        - name: Build API Gateway
          working-directory: api-gateway
          run: ./mvnw clean package -DskipTests


        # ==========================================
        # 10. Set up Docker Buildx
        # ==========================================
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3


        # ==========================================
        # 11. Check Docker
        # ==========================================
        - name: Check Docker
          run: |
            docker --version
            docker compose version
        

        # ==========================================
        # 12. Build all Docker images
        # ==========================================
        - name: Build Docker images
          run: docker compose build


        # ==========================================
        # 13. List Docker images
        # ==========================================
        - name: List Docker images
          run: docker images

