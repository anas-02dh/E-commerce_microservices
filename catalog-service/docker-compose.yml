services:

  catalog-db:
    image: postgres:17
    container_name: catalog-db

    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5433:5432"

    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  catalog_postgres_data: