spring:

  application:
    name: customer-service

  datasource:
    url: jdbc:postgresql://localhost:5434/customer_db
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ecommerce

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info


